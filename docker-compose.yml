services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobcraft
      POSTGRES_USER: jobcraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # no host port — only reachable within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # no host port — only reachable within Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  latex:
    build: ./latex
    # no host port — only api/worker reach it via Docker network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build: ./api
    ports:
      - "127.0.0.1:8001:8000"   # loopback only — Nginx proxies /api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobcraft:${POSTGRES_PASSWORD}@postgres:5432/jobcraft
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LATEX_SERVICE_URL: http://latex:8001
    volumes:
      - storage_data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      latex:
        condition: service_healthy

  worker:
    build: ./api
    command: celery -A app.workers.celery_app worker --loglevel=warning
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobcraft:${POSTGRES_PASSWORD}@postgres:5432/jobcraft
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LATEX_SERVICE_URL: http://latex:8001
    volumes:
      - storage_data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      latex:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"    # loopback only — Nginx proxies port 13007 here
    depends_on:
      - api

volumes:
  postgres_data:
  storage_data:
