services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobcraft
      POSTGRES_USER: jobcraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # S-23 fix: no host port mapping — only reachable within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # S-03 fix: Redis requires password; no host port exposure
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  latex:
    build: ./latex
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobcraft:${POSTGRES_PASSWORD}@postgres:5432/jobcraft
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LATEX_SERVICE_URL: http://latex:8001
    volumes:
      - storage_data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      latex:
        condition: service_healthy

  worker:
    build: ./api
    command: celery -A app.workers.celery_app worker --loglevel=warning
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobcraft:${POSTGRES_PASSWORD}@postgres:5432/jobcraft
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LATEX_SERVICE_URL: http://latex:8001
    volumes:
      - storage_data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      latex:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  storage_data:
