<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Georgia", serif;
    font-size: 11pt;
    line-height: 1.6;
    color: #1a1a1a;
    padding: 2.2cm 2.5cm;
    max-width: 100%;
  }
  .header {
    margin-bottom: 2em;
  }
  .header .name {
    font-size: 15pt;
    font-weight: bold;
    color: #111;
    letter-spacing: 0.01em;
  }
  .header .contact {
    font-size: 9pt;
    color: #555;
    margin-top: 4px;
  }
  .date {
    margin-bottom: 1.6em;
    font-size: 10pt;
    color: #444;
  }
  .salutation {
    margin-bottom: 1.2em;
    font-size: 11pt;
  }
  .body p {
    margin-bottom: 1.1em;
    text-align: justify;
    hyphens: auto;
  }
  .closing {
    margin-top: 2em;
  }
  .closing .sign-off {
    margin-bottom: 1.8em;
  }
  .closing .signature {
    font-weight: bold;
  }
  hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 1.4em 0;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="name">{{ sender_name }}</div>
    <div class="contact">{{ sender_contact }}</div>
  </div>

  <div class="date">{{ date }}</div>

  <hr />

  <div class="salutation">Dear Hiring Manager,</div>

  <div class="body">
    {{ body_html }}
  </div>

  <div class="closing">
    <div class="sign-off">Sincerely,</div>
    <div class="signature">{{ sender_name }}</div>
  </div>
</body>
</html>
